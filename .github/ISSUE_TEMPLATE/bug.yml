name: Bug 报告
description: 报告可复现的问题，请勿上传真实账单或敏感信息
title: "[Bug] "
labels:
  - "type:bug"
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      placeholder: 例如 0.1.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 手机与系统版本
      placeholder: 例如 vivo X200 / OriginOS 6 / Android 16
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已删除姓名、手机号、卡号、订单号、真实金额等敏感信息。
          required: true
